[package]
name = "fjyxhr-migrate-desk"
version = "0.1.0"
description = "福建影像数据迁移桌面端"
authors = ["FJYXHR"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fjyxhr_migrate_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "io-util", "process", "fs"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
