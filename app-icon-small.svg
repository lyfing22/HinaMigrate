<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 小尺寸版：纯蓝底 + 白色单个数据库圆柱 + 右侧粗箭头，16/24/32/48px 下依然清晰 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="#2F7CF6"/>

  <!-- 数据库圆柱（居中，占宽度 ~62%） -->
  <!-- 圆柱主体 -->
  <path d="M80 344 L80 680 A330 82 0 0 0 740 680 L740 344 Z" fill="#FFFFFF"/>
  <!-- 顶面椭圆 -->
  <ellipse cx="410" cy="344" rx="330" ry="82" fill="#FFFFFF"/>
  <!-- 顶面与主体分界：蓝切割线 -->
  <path d="M80 344 A330 82 0 0 0 740 344" fill="none" stroke="#2F7CF6" stroke-width="48"/>
  <!-- 中间层分界：蓝切割线 -->
  <path d="M80 512 A330 82 0 0 0 740 512" fill="none" stroke="#2F7CF6" stroke-width="48"/>
  <!-- 底层分界（圆柱底部弧） -->
  <path d="M80 680 A330 82 0 0 0 740 680" fill="none" stroke="#2F7CF6" stroke-width="48"/>

  <!-- 右侧粗箭头（与圆柱垂直居中对齐，不重叠） -->
  <!-- 箭头杆：中心 y=512 -->
  <rect x="780" y="452" width="108" height="120" fill="#FFFFFF"/>
  <!-- 箭头三角：以 512 为中心，y 408-616 -->
  <path d="M888 408 L888 616 L1000 512 Z" fill="#FFFFFF"/>
</svg>
